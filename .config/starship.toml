"$schema" = 'https://starship.rs/config-schema.json'

# ─────────────────────────────────────────────
# GLOBAL BEHAVIOR
# ─────────────────────────────────────────────
add_newline = true
scan_timeout = 200
command_timeout = 1000

format = """
[](fg:c_accent)\
$os\
[](fg:c_accent bg:c_surface)\
$username\
$directory\
$git_branch\
$git_status\
$git_state\
$kubernetes\
$c\
$cpp\
$rust\
$golang\
$nodejs\
$bun\
$php\
$java\
$kotlin\
$haskell\
$python\
$docker_context\
$conda\
$pixi\
$azure\
$gcloud\
[](fg:c_surface)\
$fill\
$cmd_duration\
$status\
$time\
$line_break$character"""

palette = 'drknss'

# Drknss: old-school black, greys, red and green (shared with .config/wezterm/wezterm.lua)
[palettes.drknss]
c_bg = '#000000'
c_surface = '#1a1a1a'
c_muted = '#6b6b6b'
c_subtle = '#a3a3a3'
c_fg = '#d9d9d9'
c_accent = '#4dd44d'
c_green = '#4dd44d'
c_red = '#e5332a'
c_olive = '#b8b84a'

[fill]
symbol = " "

# ─────────────────────────────────────────────
# LINE CONTROL
# ─────────────────────────────────────────────
[line_break]
disabled = false

# ─────────────────────────────────────────────
# PROMPT SYMBOL
# ─────────────────────────────────────────────
[character]
disabled = false
success_symbol = '[❯](bold fg:c_green)'
error_symbol = '[❯](bold fg:c_red)'
vimcmd_symbol = '[❮](bold fg:c_green)'
vimcmd_replace_one_symbol = '[❮](bold fg:c_red)'
vimcmd_replace_symbol = '[❮](bold fg:c_red)'
vimcmd_visual_symbol = '[❮](bold fg:c_olive)'

# ─────────────────────────────────────────────
# IDENTITY / CONTEXT
# ─────────────────────────────────────────────
[os]
format = '[ $symbol ]($style)'
disabled = false
style = 'bg:c_accent fg:c_bg'

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[username]
show_always = true
style_user = 'bg:c_surface fg:c_subtle'
style_root = 'bg:c_surface fg:c_red bold'
format = '[ $user ]($style)'

[directory]
style = 'bg:c_surface fg:c_green bold'
format = '[ $path ]($style)([$read_only ]($read_only_style))'
truncation_length = 3
truncation_symbol = "…/"
read_only = " 󰌾"
read_only_style = 'bg:c_surface fg:c_red'
truncate_to_repo = true

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

# ─────────────────────────────────────────────
# GIT
# ─────────────────────────────────────────────
[git_branch]
symbol = ""
style = 'bg:c_surface fg:c_fg'
format = '[ $symbol $branch ]($style)'

[git_status]
style = 'bg:c_surface fg:c_red'
format = '[($all_status$ahead_behind )]($style)'
conflicted = "≠"
ahead      = "⇡"
behind     = "⇣"
diverged   = "⇕"
untracked  = "?"
stashed    = "$"
modified   = "!"
staged     = "+"
renamed    = "»"
deleted    = "✘"

[git_state]
style = 'bg:c_surface fg:c_red bold'
format = '[ $state( $progress_current/$progress_total) ]($style)'

# ─────────────────────────────────────────────
# LANGUAGES
# ─────────────────────────────────────────────
[c]
symbol = " "
style = 'bg:c_surface fg:c_subtle'
format = '[ $symbol( $version) ]($style)'

[cpp]
symbol = " "
style = 'bg:c_surface fg:c_subtle'
format = '[ $symbol( $version) ]($style)'

[golang]
symbol = ""
style = 'bg:c_surface fg:c_subtle'
format = '[ $symbol( $version) ]($style)'

[nodejs]
symbol = ""
style = 'bg:c_surface fg:c_subtle'
format = '[ $symbol( $version) ]($style)'

[bun]
symbol = ""
style = 'bg:c_surface fg:c_subtle'
format = '[ $symbol( $version) ]($style)'

[php]
symbol = ""
style = 'bg:c_surface fg:c_subtle'
format = '[ $symbol( $version) ]($style)'

[java]
symbol = ""
style = 'bg:c_surface fg:c_subtle'
format = '[ $symbol( $version) ]($style)'

[kotlin]
symbol = ""
style = 'bg:c_surface fg:c_subtle'
format = '[ $symbol( $version) ]($style)'

[haskell]
symbol = ""
style = 'bg:c_surface fg:c_subtle'
format = '[ $symbol( $version) ]($style)'

[python]
symbol = ""
style = 'bg:c_surface fg:c_subtle'
format = '[ $symbol( $version) ]($style)'

[rust]
symbol = ""
style = 'bg:c_surface fg:c_subtle'
format = '[ $symbol( $version) ]($style)'

# ─────────────────────────────────────────────
# CLOUD
# ─────────────────────────────────────────────
[azure]
symbol = ""
style = 'bg:c_surface fg:c_subtle'
format = '[ $symbol( $subscription) ]($style)'
disabled = false

[aws]
symbol = ""
style = 'bg:c_surface fg:c_subtle'
format = '[ $symbol( $profile) ]($style)'
disabled = true

[gcloud]
symbol = "󰊮"
style = 'bg:c_surface fg:c_subtle'
format = '[ $symbol( $account) ]($style)'
disabled = false

# ─────────────────────────────────────────────
# KUBERNETES
# ─────────────────────────────────────────────
[kubernetes]
symbol = "󱃾 "
style = 'bg:c_surface fg:c_green'
format = '[ $symbol$context( \($namespace\)) ]($style)'
disabled = false
detect_env_vars = ["STARSHIP_K8S_VISIBLE"]

[[kubernetes.contexts]]
context_pattern = ".*k3s.*"
style = 'bg:c_surface fg:c_green'
symbol = "󰄬 "

[[kubernetes.contexts]]
context_pattern = ".*stage.*"
style = 'bg:c_surface fg:c_olive'
symbol = "󰀦 "

[[kubernetes.contexts]]
context_pattern = ".*prod.*"
style = 'bg:c_surface fg:c_red bold'
symbol = "󰀨 "

# ─────────────────────────────────────────────
# CONTAINER / ENV
# ─────────────────────────────────────────────
[docker_context]
symbol = ""
style = 'bg:c_surface fg:c_subtle'
format = '[ $symbol( $context) ]($style)'

[conda]
symbol = ""
style = 'bg:c_surface fg:c_subtle'
format = '[ $symbol( $environment) ]($style)'

[pixi]
style = 'bg:c_surface fg:c_subtle'
format = '[ $symbol( $version)( $environment) ]($style)'

# ─────────────────────────────────────────────
# TIME
# ─────────────────────────────────────────────
[time]
disabled = false
time_format = "%R"
style = 'fg:c_muted'
format = '[ $time]($style)'

# ─────────────────────────────────────────────
# RIGHT PROMPT
# ─────────────────────────────────────────────
[cmd_duration]
min_time = 800
format = '[󱎫 $duration]($style) '
style = 'fg:c_olive'

[status]
disabled = false
format = '[󰅚 $status]($style) '
style = 'fg:c_red bold'
map_symbol = true